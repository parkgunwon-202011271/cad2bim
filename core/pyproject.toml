[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2bim"
version = "0.1.0"
description = "CAD 평면도를 Revit 1개 층으로 변환하는 프로토타입 코어"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4",
    "shapely>=2.1",
    "scipy>=1.11",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "ifcopenshell>=0.8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7", "pycollada>=0.9", "pillow>=10"]
render = ["numba>=0.60", "pillow>=10"]
llm = ["google-genai>=1.0", "anthropic>=0.40", "openai>=1.0"]  # 켤 때만: CAD2BIM_LLM=openai|gemini|anthropic, 키는 .env

[project.scripts]
cad2bim = "cad2bim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 프로토타입에 외부 통신이 없음을 테스트 전체에서 강제한다 (상세설계 8.3).
addopts = "--disable-socket"
