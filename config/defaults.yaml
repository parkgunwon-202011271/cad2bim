# 모든 값은 초기값이다. 실제 도면으로 조정한다. 길이 단위는 mm.
units:
  # DIMENSION 표기값 / 실제 길이 비율로 축척을 판정한다.
  min_dimension_samples: 3
  ratio_tolerance: 0.02      # 중앙값에서 이 비율 이내면 일치로 본다
  min_consistent_share: 0.8  # 일치 표본이 이 비율 이상이어야 믿는다
  majority_share: 0.6        # 흔한 축척값에 맞으면 이 비율로도 받되 scale_mixed로 표시한다
  snap_tolerance: 0.01       # 흔한 축척값에 이 비율 이내면 맞춘다
  snap_values: [1, 10, 25.4, 100, 304.8, 1000]

normalize:
  collinear_angle_deg: 0.5
  collinear_offset_mm: 1.0
  gap_mm: 5.0
  min_length_mm: 1.0

curves:
  flatten_sagitta_mm: 1.0

regions:
  cluster_gap_mm: 1500.0
  min_plan_primitives: 20
  min_plan_diagonal_mm: 3000.0
  title_box_max_area_ratio: 0.25
  frame_min_content_share: 0.95
  sheet_size_tolerance: 0.01  # 나란한 도곽끼리 크기 차이
  min_frame_side_mm: 3000.0
  frame_line_pair_mm: 600.0   # 선으로 그린 도곽 칸: 이 거리 안에 나란한 긴 선이 또 있으면 벽(두 줄)으로 보고 칸으로 치지 않는다
  plan_min_share_of_largest: 0.05
  frame_span_share: 0.9      # 이만큼 도곽을 가로지르는 선은 도곽선이나 표제란 경계다
  frame_band_share: 0.3      # 도곽 가장자리에서 이 비율 안의 선만 경계로 본다
  frame_clip_max_share: 0.3  # 이보다 많이 지워지면 평면까지 지우는 것이므로 하지 않는다

origin:
  far_threshold_mm: 100000.0
  offset_round_mm: 1000.0

columns:
  min_size_mm: 200.0
  max_size_mm: 2000.0
  max_aspect: 3.0
  hatch_min_iou: 0.8
  layer_trust_min_count: 4   # 이만큼 있으면 기둥 레이어만 믿는다
  # 격자 반복으로 추정하는 기둥. 결과는 항상 review다
  grid_max_aspect: 1.5
  grid_min_count: 8
  grid_max_count: 2000
  grid_align_mm: 10.0
  grid_min_share: 0.7
  grid_min_spacing_mm: 3000.0
  grid_line_tol_mm: 300.0
  line_min_count: 6
  line_min_share: 0.7
  line_multiple_tol: 0.1
  line_min_regular_share: 0.8
  grid_min_size_mm: 300.0    # 레이어나 채움 근거 없이 기둥으로 볼 최소 크기
  # 기둥 레이어의 사각형이 아닌 닫힌 도형(모서리를 딴 ㄱ자 기둥 등). 그린 모양 그대로 만든다
  polygon_max_points: 12
  polygon_min_fill: 0.7      # 도형 넓이 / 감싸는 가장 작은 사각형 넓이. 낮으면 벽 조각으로 본다
  polygon_max_overlap: 0.5   # 이미 받은 기둥과 이만큼 겹치면 같은 기둥을 겹쳐 그린 선으로 본다

walls:
  direction_tolerance_deg: 0.5
  min_segment_mm: 1.0
  # 미분류 레이어를 벽으로 추정하는 기준. 결과는 항상 review다
  infer_min_paired: 0.6
  # 벽 이름이 없을 때 모양으로 벽 레이어를 고른다
  infer_shape_min_share: 0.03
  infer_shape_long_mm: 2000.0
  infer_shape_min_long_share: 0.23
  infer_shape_near_best: 0.75
  column_bridge_offset_mm: 400.0   # 같은 축 두 벽 사이를 이 거리 안의 기둥이 막으면 잇는다(기둥 바깥 외벽 패널)
  column_bridge_slack_mm: 300.0    # 기둥 크기에 더해 이만큼 떨어진 끝까지 잇는다
  slit_max_mm: 60.0                # 나란한 두 벽 면 사이가 이 이하면 메운다(두 겹 패널)
  slit_min_overlap_mm: 1000.0
  door_panel_min_mm: 2000.0        # 벽 없이 문 레이어의 나란한 두 선(이 길이 이상)으로 그린 큰 문은 문짝 벽으로 만든다
  door_panel_min_gap_mm: 40.0
  door_panel_max_gap_mm: 200.0
  column_layer_wall_min_mm: 1500.0  # 기둥 레이어의 이 길이 이상 선(기둥이 안 쓴 것)도 벽 후보. 코어벽을 구조 레이어에 그리는 도면
  weak_wall_max_share: 0.01
  weak_wall_min_length_mm: 5000.0
  infer_min_length_mm: 50000.0
  infer_max_thickness_mm: 500.0
  # 미분류 선에서 닫힘을 근거로 찾는 벽. 결과는 항상 review다
  # 꺼 둔다. 2026-11-05 시험에서 단면도에 새 벽이 10.2%(기준 5%) 생겨 불합격했다
  candidate_enabled: false
  candidate_min_thickness_mm: 30.0
  candidate_max_thickness_mm: 600.0
  candidate_min_length_mm: 2000.0
  candidate_anchor_reach_mm: 1000.0
  candidate_door_gap_mm: 1500.0
  candidate_min_region_mm2: 4000000.0
  candidate_passes: 3
  candidate_repeat_min: 4
  candidate_repeat_length_bin_mm: 500.0
  candidate_repeat_gap_tol_mm: 100.0
  # 벽, 기둥 레이어의 닫힌 도형 중 아직 안 잡힌 작은 것. 그린 모양 그대로 만든다
  pier_max_size_mm: 3000.0
  pier_min_area_mm2: 20000.0
  pier_max_covered_share: 0.5
  pier_cover_margin_mm: 20.0
  # 창호 선으로만 그린 유리벽. 결과는 항상 review다
  glazed_min_thickness_mm: 20.0
  glazed_max_thickness_mm: 400.0
  glazed_min_length_mm: 1000.0
  glazed_anchor_reach_mm: 1500.0
  glazed_cover_margin_mm: 100.0
  glazed_duplicate_margin_mm: 200.0
  glazed_min_output_mm: 100.0
  # 문틀·기둥 사이의 짧은 창. 양 끝이 벽이나 기둥에 바로 닿을 때만 glazed_min_length_mm보다 짧아도 받는다
  glazed_short_min_length_mm: 500.0
  glazed_short_anchor_mm: 150.0
  # 벽 끝 바로 옆, 같은 벽 축에 걸린 문 호. 벽선 없이 문틀만 그린 문 자리를 벽으로 메운다. 결과는 항상 review다
  door_gap_reach_mm: 300.0   # 벽 끝에서 문짝까지 이보다 멀면 메우지 않는다
  door_gap_anchor_mm: 100.0  # 반대쪽 문짝 끝이 벽·기둥에 이만큼 닿아야 한다
  # 문 호 옆의 미분류 평행선을 벽으로 올리는 기준. 결과는 항상 review다
  door_evidence_reach_mm: 1500.0
  door_evidence_max_thickness_mm: 600.0
  infer_min_mode_share: 0.6
  part_block_max_mm: 5000.0   # 이보다 작은 블록은 부품으로 보고 벽 후보에서 뺀다
  min_thickness_mm: 80.0
  max_thickness_mm: 1000.0
  min_overlap_mm: 100.0
  thickness_bin_mm: 10.0
  peak_min_share: 0.03       # 칸막이벽은 길이 비중이 작다
  peak_snap_mm: 20.0
  outlier_min_length_mm: 1000.0
  axis_tolerance_mm: 15.0
  max_bridge_mm: 4000.0      # 이보다 넓은 틈은 개구부로 보지 않는다
  min_wall_length_mm: 300.0
  arc_step_deg: 15.0          # 곡선 벽을 이 각도마다 끊어 짧은 직선 벽으로 만든다. 0이면 곡선 벽을 만들지 않는다(미지원으로 남김)
  junction_tolerance_mm: 50.0
  opening_fill_min_share: 0.5
  single_line_min_mm: 500.0
  single_line_thickness_mm: 100.0
  hatch_samples: 5
  # 벽 레이어가 없을 때만 쓴다
  geometric_hatch_min_share: 0.5
  geometric_piece_min_share: 0.5
  stair_min_repeats: 3
  stair_max_spacing_mm: 400.0
  stair_spacing_tolerance_mm: 5.0
  stair_extent_tolerance_mm: 50.0

openings:
  min_radius_mm: 500.0
  max_radius_mm: 1500.0
  quarter_tol_deg: 10.0
  axis_tolerance: 0.1        # 호 끝이 벽 방향에서 벗어나도 되는 비율
  host_tolerance_mm: 50.0
  door_layer_tolerance_mm: 200.0
  parallel_cos: 0.999
  axis_offset_mm: 20.0
  min_gap_mm: 400.0
  door_min_gap_share: 0.5    # 문짝 폭의 이만큼은 벽선이 끊겨 있어야 그 벽의 문으로 본다
  leaf_line_tolerance_mm: 30.0  # 문짝 선 끝이 경첩·호 끝과 이만큼 안에 있으면 그 호의 문짝이다
  line_min_coverage: 0.8
  window_min_lines: 2
  # 벽선이 끊기지 않고 벽 두께 안에 창호 선이 나란히 지나가는 구간을 창으로 본다(유리 외벽). 0이면 끈다.
  window_in_wall_min_mm: 600.0   # 이보다 짧은 구간은 창으로 보지 않는다
  window_in_wall_gap_mm: 150.0   # 창틀로 끊긴 간격이 이보다 작으면 한 창으로 잇는다
  window_in_wall_tol_mm: 10.0    # 벽 면에서 이만큼 벗어난 선까지 벽 안의 선으로 본다
  door_gap_reach_mm: 300.0   # 벽 틈 둘레 이 거리 안의 문 레이어 선을 본다
  door_gap_min_share: 0.5    # 문 레이어 선이 틈 폭의 이 비율 이상이면 문(호 없는 미닫이·오버헤드·방열문)

rails:
  # 난간 양쪽 면을 두 선으로 그린 경우 한 난간으로 합친다
  pair_max_offset_mm: 300.0
  pair_min_overlap: 0.5      # 짧은 선 길이의 이만큼 이상 겹쳐야 한다
  pair_parallel_cos: 0.9998  # 약 1도
  pair_offset_tol_mm: 20.0   # 두 선 사이 간격이 끝과 끝에서 이만큼까지 달라도 나란한 것으로 본다

rooms:
  min_area_mm2: 100000.0
  unnamed_min_area_mm2: 1000000.0
  outside_tol_mm: 1.0
  boundary_tol_mm: 5.0
  area_note_tolerance: 0.05

confidence:
  high_threshold: 0.85
  hatch_min_share: 0.5
  weights: {layer: 0.4, geometry: 0.4, material: 0.2}

stairs:
  min_tread_mm: 500.0
  min_treads: 3
  min_spacing_mm: 150.0
  max_spacing_mm: 450.0
  spacing_tol_mm: 30.0
  min_overlap_share: 0.5
  angle_bin_deg: 1.0
  join_gap_mm: 2500.0

voids:
  min_side_mm: 1000.0
  corner_tol_mm: 50.0
  corner_tol_share: 0.03    # 큰 X자는 대각선 길이의 이 비율까지 모서리 어긋남을 받는다
  min_overlap_iou: 0.6      # 고르지 않은 실의 X: 서로 가로지르고 두 대각선 범위가 이만큼 겹치면 뚫린 곳

export:
  # 공식 SketchUp C SDK 위치. 저장소에 넣지 않는다. CAD2BIM_SKETCHUP_SDK가 있으면 그쪽이 먼저다
  sketchup_sdk_dir: "C:/SDK_Win"
  # 평면에 없는 값의 가정값. 도면에서 읽게 되면 대체한다
  door_height_mm: 2100.0
  wide_door_height_mm: 2400.0
  wide_door_min_width_mm: 1500.0
  window_sill_mm: 900.0
  window_height_mm: 1800.0
  rail_height_mm: 1200.0
  rail_thickness_mm: 100.0
  slab_thickness_mm: 200.0
  slab_close_mm: 3000.0
  slab_min_area_m2: 10.0
  slab_trim_mm: 1000.0
  landing_thickness_mm: 200.0   # 계단참과 계단판 두께
  # 엘리베이터: 닫힌 사각형 안(또는 바로 옆)에 이 글자가 있으면 승강로다
  elevator_label_pattern: "^\\s*(E\\s*[./]?\\s*V\\.?(\\s*\\d+)?|ELEV.*|엘리베이터.*|승강기.*)\\s*$"
  elevator_min_side_mm: 1000.0
  elevator_max_side_mm: 4000.0
  elevator_label_reach_mm: 300.0
  elevator_door_reach_mm: 1000.0  # 승강로 표시(카 외곽)에서 이 거리 안의 벽 개구부를 승강기 문으로 본다. 카와 벽 사이 틈과 벽 두께 절반을 넘는다
  # 가구 이름표. 가구 도형 안이나 이 거리 안의 글자, 가구를 가리키는 지시선 글자로 종류를 정한다. 없으면 기호와 크기로 가늠한다.
  # kind는 만들 모양이다(core/src/cad2bim/export/furniture_models.py). z0·z1을 적으면 그 높이를 쓰고, m은 몸통 재질이다.
  # skip: 만들지 않는다. ignore: 이 글자는 이름표로 쓰지 않는다(여러 가구를 한꺼번에 가리키는 글자).
  furniture_label_reach_mm: 900.0
  furniture_labels:
    - {pattern: "비상벨|emergency", kind: skip}            # 벽에 다는 장치
    - {pattern: "엘리베이터|승강기|^\\s*E\\s*[./]?\\s*V", kind: skip}  # 승강로는 따로 만든다
    - {pattern: "\\bset\\b|세트", kind: ignore}            # 'SOFA&TABLE SET'처럼 묶음을 가리키는 글자
    - {pattern: "upper\\s*shelf|상부\\s*(장|선반)", kind: upper}
    - {pattern: "bar\\s*(chair|stool)|바\\s*(의자|체어)|스툴", kind: bar_stool}
    - {pattern: "bar\\s*table|바\\s*테이블", kind: bar}
    - {pattern: "work\\s*table|작업대|조리대", kind: counter, m: steel}
    - {pattern: "sink|싱크|개수대", kind: sink}
    - {pattern: "stove|gas\\s*range|레인지|화구", kind: stove}
    - {pattern: "^\\s*ref\\b\\.?|refrig|냉장|냉동", kind: fridge}
    - {pattern: "자판기|vending", kind: appliance, z0: 0, z1: 1800}
    - {pattern: "show\\s*case|쇼케이스|진열", kind: showcase}
    - {pattern: "counter|카운터", kind: counter, z1: 1000}
    - {pattern: "정수기|water", kind: appliance, z0: 0, z1: 1200}
    - {pattern: "키오스크|kiosk", kind: appliance, z0: 0, z1: 1500}
    - {pattern: "소화전|소화기|hydrant|extinguish", kind: appliance, z0: 0, z1: 1500}
    - {pattern: "소변기|urinal", kind: urinal, z0: 350, z1: 1000}  # 벽걸이
    - {pattern: "대변기|양변기|toilet|w\\.?c", kind: toilet}
    - {pattern: "wash\\s*stand|세면|lav", kind: vanity}
    - {pattern: "^\\s*S\\.?\\s*K|청소|mop", kind: fixture, z0: 0, z1: 600}
    - {pattern: "신발장|shoe", kind: cabinet, z1: 1200}
    - {pattern: "사물함|락커|locker|수납장|캐비닛|cabinet|문서함", kind: cabinet, z1: 1800}
    - {pattern: "책장|서가|book|shelf|선반", kind: shelf, z1: 1800}
    - {pattern: "소파|sofa|안마의자", kind: sofa}
  # ㄷ자 계단의 계단참을 계단 범위 밖에 둘 때. 깊이는 끝에서 벽까지이되 이 사이로 맞춘다
  stair_max_riser_mm: 200.0      # 단 높이가 이를 넘으면 평면의 계단을 위로 되풀이한다(층고가 높은 층)
  stair_landing_min_mm: 900.0
  stair_landing_max_mm: 2500.0
  stair_access_probe_mm: 600.0  # 계단 끝 바깥 이만큼에 윗층 바닥이 있으면 그쪽에서 오르기 시작한다
  stair_access_min_share: 0.5   # 그 띠의 이만큼 이상이 바닥이어야 내려설 곳으로 본다
  # 건물 밖 요소. 도면에 높이 표기가 없는 값의 가정값이다
  site_base_depth_mm: 500.0
  site_level_slack_mm: 500.0
  site_strip_max_width_mm: 1200.0
  site_stair_max_tread_mm: 400.0
  site_seat_height_mm: 450.0
  site_planter_height_mm: 550.0
  site_roof_planter_height_mm: 500.0
  site_lawn_height_mm: 60.0
  site_rail_thickness_mm: 50.0
  site_rail_post_spacing_mm: 1500.0
  site_apron_mm: 12000.0
  site_bollard_height_mm: 900.0
  site_stripe_width_mm: 120.0
  site_stripe_height_mm: 20.0
  site_bench_max_area_mm2: 6000000.0
  site_equipment_height_mm: 1500.0
  site_parapet_height_mm: 500.0
  site_parapet_width_mm: 200.0
  site_penthouse_height_mm: 1100.0
  # 조감도 연출 요소. 도면에 없는 값이고 규칙으로만 배치한다. 태그를 끄면 사라진다
  site_tree_height_mm: 6500.0
  site_tree_spacing_mm: 8000.0
  site_tree_limit: 60
  site_tree_clearance_mm: 3500.0
  site_tree_inset_mm: 1500.0
  site_street_tree_offset_mm: 3000.0
  site_shrub_spacing_mm: 900.0
  site_shrub_limit: 60
  site_car_length_mm: 4500.0
  site_car_width_mm: 1800.0
  site_slot_min_mm: [2000.0, 4000.0]
  site_slot_max_mm: [3700.0, 6500.0]
  site_parking_occupancy: 0.6
  site_default_margin_mm: 10000.0
  # 조감도 시점과 그림. 앞 단계 품질을 먼저 올리기로 해 그림 생성은 꺼 둔다
  aerial_enabled: false
  aerial_elevation_degrees: 32.0
  aerial_fov_degrees: 28.0
  aerial_width_px: 2400
  aerial_samples_per_pixel: 16
  aerial_sky_samples: 2
  shadow_day_of_year: 288
  # 실사화. 구도와 AI 강도이고 건물별 값이 아니다
  photo_enabled: false
  photo_python: "~/.cad2bim_ai/Scripts/python.exe"
  photo_elevation_degrees: 25.0
  photo_fov_degrees: 60.0
  photo_fill: 0.8
  photo_lift: 0.33
  photo_city_block_mm: 36000.0
  photo_city_street_mm: 9000.0
  photo_city_reach_mm: 800000.0
  photo_seed: 7
  photo_strength: 0.8
  photo_depth_scale: 0.75
  photo_edge_scale: 0.55
  photo_steps: 34
  photo_guidance: 5.5
  photo_refine_strength: 0.3
  site_skylight_curb_mm: 1200.0
  site_skylight_curb_width_mm: 150.0
  site_skylight_rise_mm: 1000.0
  site_pergola_height_mm: 2850.0
  site_pergola_post_mm: 150.0
  site_pergola_beam_mm: 300.0
  site_pergola_slat_spacing_mm: 400.0
  # 스케치업 그림자. 모양을 내는 고정값이다. 위치는 도면에 없어 서울을 쓰고, 도면 위쪽을 북으로 둔다
  shadow_light: 80
  shadow_dark: 60
  shadow_latitude: 37.5
  shadow_longitude: 127.0
  shadow_timezone: 9.0
  # 그 지역의 시계 시각이다. 스케치업은 이 값을 시간대 변환 없이 그대로 읽는다
  shadow_time_local: "2026-10-15T14:00:00"

# LLM 보조 판단. 기본은 꺼짐(외부 통신 없음). 환경 변수 CAD2BIM_LLM(off|anthropic|cache)이 이 값보다 앞선다.
# 켜면 레이어 이름과 통계(좌표·글자 내용 제외)를 Claude로 보낸다. 답은 결과 폴더의 _llm/에 저장해 다시 쓴다.
llm:
  enabled: false
  provider: anthropic        # anthropic | gemini | cache(저장된 답만 사용). 환경 변수 CAD2BIM_LLM이 앞선다
  models:                    # 공급자별 모델. 키는 환경 변수(ANTHROPIC_API_KEY, GEMINI_API_KEY)에서만 읽는다
    anthropic: claude-sonnet-5-5
    gemini: gemini-3.5-flash-lite   # 무료 등급에서 하루 500번·분당 15번까지 쓸 수 있는 모델
  requests_per_minute: 14    # 분당 호출 한도보다 조금 낮게. 0이면 쉬지 않는다
  max_layers_per_call: 150

# 레이어 역할 학습 예시(처리 단계 3-a). 사전이 '모름'으로 둔 레이어만 가장 비슷한 예시의 역할로 채운다.
# 기본은 꺼짐(시연 결과를 바꾸지 않기 위해). 켜려면 enabled: true 또는 환경 변수 CAD2BIM_LEARNED_LAYERS=1.
# 비공개 도면에서 만든 예시는 저장소 밖 파일로 두고 CAD2BIM_LAYER_EXAMPLES(;로 구분)로 알려 준다.
learned_layers:
  enabled: false
  examples: [layer_examples.json]   # config 폴더 기준. 공개 도면에서 만든 예시
  k: 3                              # 가까운 예시 몇 개로 다수결할지
  min_confidence: 0.6               # 그 밖의 역할은 이 비율 이상 같아야 쓴다. 벽·계단·문 등 형상 역할은 만장일치만

review_ml:
  path: models/spot_model.joblib   # CAD2BIM_LLM=ml 일 때 쓰는 틈 판정 모델(저장소 기준 경로). CAD2BIM_SPOT_MODEL이 먼저
  min_prob: 0.5                     # 이보다 확신이 낮으면 답하지 않고 대기 목록에 둔다
